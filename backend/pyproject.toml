[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-view-geometry-api"
version = "0.1.0"
description = "Traceable mesh ingestion and qualification API"
requires-python = ">=3.10"
dependencies = [
    "cadquery",
    "fastapi",
    "imageio-ffmpeg",
    "manifold3d",
    "mapbox-earcut",
    "networkx",
    "numpy",
    "pillow",
    "python-multipart",
    "rtree",
    "shapely",
    "trimesh",
    "fast_simplification",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
]
vision = [
    "torch",
    "torchvision",
    "transformers",
    "einops",
    "huggingface_hub",
    "omegaconf",
    "safetensors",
    "scikit-image",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
py-modules = [
    "main",
    "camera_intrinsics",
    "generative_reconstruction",
    "mesh_repair",
    "neural_reconstruction",
    "parametric_reconstruction",
    "primitive_fitting",
    "recipe_selection",
    "residual_reconstruction",
    "reconstruction",
    "revolve_reconstruction",
    "segmentation",
    "solid_agreement",
    "surface_analysis",
    "triposr_runner",
]
